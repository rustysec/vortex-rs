# vortex configuration
#
# All keys are optional; anything you leave out keeps its default (shown here).
# Keys are kebab-case. Copy this file to ~/.config/vortex/config.toml (or point
# `vortex -c` at it), and reload while vortex runs with `:config source`.
#
# `vortex --check-config` validates it; `vortex --write-config` writes this
# document there for you. A test keeps these defaults honest, so if the code
# changes and this file does not, `cargo test` says so.

# ---------------------------------------------------------------------------
# text editing
# ---------------------------------------------------------------------------
[editor]
tab-width = 4                 # width of a tab stop
expand-tab = true             # insert spaces instead of tab characters
line-number = "relative"      # "absolute" | "relative" | "none"
cursorline = true             # highlight the row the cursor is on
scroll-margin = 4             # rows kept visible above/below the cursor
sidescroll-margin = 4         # columns kept visible left/right of the cursor
mouse = true                  # click to focus a pane, drag to select
auto-indent = true            # repeat the indentation of the current line on enter
auto-match-pairs = true       # type `(` and `()` appears with the cursor inside
wrap = false                  # soft wrap long lines
clipboard = true              # copy yanks to the terminal clipboard (OSC-52)
undo-limit = 1000             # undo steps kept per buffer
undo-group-timeout = "500ms"  # idle time that closes an undo group
large-file-threshold = 2000000 # bytes; bigger files skip background work
diagnostic-signs = true       # mark flagged lines in the gutter (● error, ▲ warning)
inline-diagnostics = false    # draw the message dimmed at the end of its line
diagnostic-float = true       # show the full message when the caret rests on one

# Per-language indentation, overriding the two settings above.  Only the keys
# given are overridden, so a language can change just the width or just the
# character.  Keys are language ids, as used by [format.command] and [lsp.servers].
# [editor.indent.go]
# tab-width = 4
# expand-tab = false          # Go indents with tabs
# [editor.indent.yaml]
# tab-width = 2

# ---------------------------------------------------------------------------
# status row
#
# One row, always: it says what is true of the buffer.  Messages, key echoes and
# prompts are transient, so they float on a card over the panes instead of
# taking a row that would have to be cleared and restored underneath them.
# ---------------------------------------------------------------------------
[status]
position = "bottom"           # "top" | "bottom"
notice-position = "bottom"    # where the message / prompt / key-echo card
                              # floats over the panes: "top", "top-right",
                              # "right", "bottom-right", "bottom",
                              # "bottom-left", "left", "top-left".  The card
                              # always keeps one clear row between itself and
                              # the status bar on that side.
separators = "angled"         # "angled" (powerline segments) | "plain"
show-mode = true              # "normal" / "insert" / "visual" / "command"
show-git-branch = true        # git branch of the focused file's repository
show-pane-name = true         # label of the focused text pane
show-diagnostics = true       # lsp / spell rollup: "2e 1w"
show-position = true          # line:col
show-language = true          # detected language
show-encoding = true          # "utf-8", or "binary" for undecodable bytes
show-lsp = true               # language server attached to the focused pane
show-percentage = true        # how far through the file
message-timeout = "6s"        # how long status messages stay up

# ---------------------------------------------------------------------------
# panes and splitting
# ---------------------------------------------------------------------------
[layout]
split-mode = "equal"          # "equal" | "golden" — sizing only, the split
                              # direction is chosen per command:
                              #   `space h` / `:split`  stack below
                              #   `space v` / `:vsplit` place side by side
                              #   `space n`             roomier axis: side by
                              #             side while the focused pane is
                              #             physically wider than tall — cells
                              #             are about twice as tall as wide, so
                              #             that means roughly twice as many
                              #             columns as rows; stacked otherwise
                              #             (the other axis is used if there is
                              #             no room)
                              #   equal:  splits keep even shares
                              #   golden: focused pane gets golden-ratio of
                              #             the whole window (spread over the
                              #             splits on its focus path),
                              #             re-balanced on focus change;
                              #             splits away from the focus take
                              #             the golden ratio too (first child
                              #             larger), so every pane resizes,
                              #             not just the focused sub-split;
                              #             a split is refused unless both
                              #             golden-sized halves meet
                              #             min-height/min-width
border = "rounded"            # "rounded" | "plain" | "square" | "none"
show-labels = true            # buffer name in the pane border
show-flags = true             # "+" modified / "ro" markers next to the label
min-height = 3                # usable rows per pane
min-width = 12                # usable columns per pane
golden-ratio = 0.618          # fraction of the parent for the focused pane
split-ratio = 0.5             # fraction given to a new pane (equal mode)
resize-step = 0.1             # fraction of the parent per resize step

# ---------------------------------------------------------------------------
# searching (ripgrep is used when present)
# ---------------------------------------------------------------------------
[search]
ripgrep = "auto"              # "auto" | path to rg | "off" (use built-in walker)
hidden = false
follow = false
ignore = true                 # honour .gitignore
prune = ["target", "node_modules", ".git"]
ignore-case = false           # vim's ignorecase; searches are case sensitive by default
smart-case = true             # uppercase in a pattern makes it case sensitive again
max-results = 5000
highlight = true              # highlight search matches in the text

# ---------------------------------------------------------------------------
# automatic formatting
# ---------------------------------------------------------------------------
[format]
on-idle = "500ms"             # format after this much typing silence ("off" disables)
                              # held until the gesture in the buffer ends — insert mode, an
                              # armed `d` waiting for its motion, a visual selection, an open
                              # prompt: it never reformats text out from under your hands,
                              # and `u` walks back your edits, not the formatter's
on-save = true                # format before writing: the write waits for the formatter,
                              # and still happens if the formatter fails or never answers

# Formatter commands per language.  The buffer is piped to stdin and the formatted
# text is read back from stdout.  "" disables a language, "!" runs via the shell.
# Defaults: rust → rustfmt, python → ruff/black, js/ts/json → prettier,
# toml → taplo, go → gofmt, c → clang-format (each used only if installed).
[format.command]
# rust = "rustfmt --edition 2024 --emit stdout"
# python = "ruff format -"
# markdown = "!pandoc -f markdown -t markdown"

# ---------------------------------------------------------------------------
# language servers (diagnostics and insert-mode completion)
# ---------------------------------------------------------------------------
[lsp]
# Language server support: initialize handshake, document sync, diagnostics
# (both pushed and pulled) and `textDocument/completion`.  Formatting stays
# external (see [format.command]).
# Turning this on also implies well-known servers (rust-analyzer, pylsp, gopls,
# clangd) when those binaries are installed, which is why it is off by default.
enable = false
# Ask the server for completions while typing in insert mode.  The popup opens
# once typing pauses; Tab/Enter accept, the arrows move, Esc closes it.
completion = true
# How edits reach the server: "incremental" sends a range per change, "full"
# resends the whole document every time.  Incremental is the default because a
# whole-buffer send per keystroke is megabytes of JSON for a one-character edit.
# "full" is always correct, so it is the thing to try when diagnostics look like
# they describe text that is not there.
sync = "incremental"

# Name a server explicitly to override the implied choice; "" or enable = false
# turns a language's server off.
# [lsp.servers.rust]
# command = "rust-analyzer"
# args = []
# languages = ["rust"]        # optional: restrict this server to these languages
# enable = true

# ---------------------------------------------------------------------------
# spell checking (comments and strings, curly underline, `z=` to fix)
# ---------------------------------------------------------------------------
[spell]
enable = true
command = "auto"              # "auto" | "aspell" | "hunspell" | "off"
language = "auto"             # dictionary for aspell/hunspell, e.g. "en_GB"; "auto" asks the engine
only-comments = true          # only check comments and strings
min-len = 4                   # ignore short words
ignore-camel-case = true      # ignore IdentifiersLikeThis
case-sensitive = false        # true: "Hello" is checked as typed, not as "hello"

# ---------------------------------------------------------------------------
# colours
#
# Empty string = follow the terminal's colour scheme.  Otherwise: "reset",
# "black" "red" "green" "yellow" "blue" "magenta" "cyan" "white",
# the "bright-" variants, or "#rrggbb".
# ---------------------------------------------------------------------------
[theme]

# vortex asks the terminal how dark it is (an OSC 11 background query at
# startup, answered in a millisecond or two, skipped if you are already typing).
# The answer picks the highlight colours, the focused pane border and the quiet
# blends used for the cursor line, selection, gutter and inactive borders.
# Pin it if the guess is wrong: "dark" or "light".  At runtime, try the other
# one with `:set theme.background=light`.
background = "auto"

# Focused pane border and label: a colour name or "#rrggbb".
# "" = bright cyan on a dark terminal, dark blue on a light one.
accent = ""

# Style strings are "<colour> [bold] [italic] [underline] [dim] [on <colour>]";
# colours are terminal names (red, bright-cyan, gray…), "#rrggbb" or "color13".
# "" keeps the palette value, which is built from your terminal's own 16 ANSI
# colours — vortex follows the theme rather than shipping one.
mode-normal = ""
mode-insert = ""
mode-visual = ""
mode-command = ""
# Angled status row (see [status] separators): the strip behind the segments,
# the filled primary segments (file name, cursor position), the quieter ones
# (encoding, language …) and the accent chips (git branch, language server).
# The mode chip fills with its own mode-<name> colour.
status-bar = ""
status-segment = ""
status-soft = ""
status-mark = ""
border = ""
border-focused = ""
label = ""
label-focused = ""
selection = ""
cursor-line = ""
gutter = ""
gutter-active = ""
keyword = ""
string = ""
comment = ""
number = ""
function = ""
type-name = ""
constant = ""
property = ""
operator = ""
punctuation = ""
error = ""
diagnostic-error = ""
diagnostic-warning = ""
diagnostic-hint = ""
diagnostic-info = ""
search-match = ""
prompt = ""

# ---------------------------------------------------------------------------
# keymap
#
# Vortex binds nothing on its own: a key does what a line below says, and
# otherwise does nothing at all.  There is no hidden set of built-ins waiting to
# be shadowed, so `:map` shows your configuration and `vortex --list-actions`
# lists the names it can take.  The one exception is text input in insert mode —
# printable characters, backspace, enter and the arrow keys are how you write,
# not commands, and they work with an empty file (a line claiming one of them
# still wins).
#
# Keys are written in kebab-case: "ctrl-s", "shift-tab", "g g" (a sequence),
# "<", ">".  Values are action names (`vortex --list-actions` prints them all) or
# `:` command names, with or without the colon ("save", "bnext" and ":bnext" all
# work); "none" unbinds a key.  A `[keymap.normal]` motion also works in visual
# mode (where it extends the selection) and while an operator waits for its
# motion, so `d` plus anything below deletes; `[keymap.visual]` and
# `[keymap.operator]` add to that or override it.
#
# What follows is the vim-style starter `vortex --write-config` gives you.  Cut
# it down freely — an unbound key costs nothing but the key.
# ---------------------------------------------------------------------------
[keymap.normal]
# movement
"h" = "move-left"
"j" = "move-down"
"k" = "move-up"
"l" = "move-right"
"0" = "line-start"
"^" = "first-non-blank"
"$" = "line-end"
"_" = "line-end-non-blank"
"|" = "column"
"w" = "word-forward"
"b" = "word-back"
"e" = "word-end"
"ge" = "word-end-back"
"W" = "big-word-forward"
"B" = "big-word-back"
"E" = "big-word-end"
"gE" = "big-word-end-back"
"f" = "find-char"
"F" = "find-char-back"
"t" = "till-char"
"T" = "till-char-back"
";" = "repeat-find"
"," = "repeat-find-reverse"
"gg" = "document-start"
"G" = "document-end"
"H" = "view-top"
"M" = "view-middle"
"L" = "view-bottom"
"}" = "paragraph-next"
"{" = "paragraph-prev"
")" = "sentence-next"
"(" = "sentence-prev"
"%" = "match-bracket"
"n" = "search-next"
"N" = "search-prev"
"pageup" = "page-up"
"pagedown" = "page-down"
"ctrl-b" = "page-up"
"ctrl-f" = "page-down"
"ctrl-u" = "half-page-up"
"ctrl-d" = "half-page-down"
"ctrl-y" = "scroll-line-up"
"ctrl-e" = "scroll-line-down"
"ctrl-o" = "jump-back"
"ctrl-i" = "jump-forward"
"z z" = "recenter"
"z t" = "scroll-to-top"
"z b" = "scroll-to-bottom"
# text objects
# insert / mode
"i" = "insert"
"gi" = "insert-previous"
"a" = "append"
"A" = "append-line-end"
"I" = "insert-line-start"
"o" = "open-below"
"O" = "open-above"
"v" = "visual"
"V" = "visual-line"
"ctrl-v" = "visual-block"
"esc" = "cancel"
# operators
"d" = "delete"
"c" = "change"
"y" = "yank"
"r" = "replace"
"J" = "join"
">" = "indent"
"<" = "unindent"
"=" = "reindent"
"~" = "swap-case-char"
"g~" = "swap-case"
"gU" = "uppercase"
"gu" = "lowercase"
"gc" = "toggle-comment"
"x" = "delete-char"
"X" = "delete-char-back"
"s" = "change-char"
"S" = "change-line"
"D" = "delete-to-line-end"
"C" = "change-to-line-end"
"Y" = "yank-line"
"p" = "paste-after"
"P" = "paste-before"
"u" = "undo"
"ctrl-r" = "redo"
"." = "repeat"
"m" = "set-mark"
"`" = "goto-mark-char"
"'" = "goto-mark-line"
"gp" = "paste-after"
"gs" = "duplicate-line"
# search & prompts
"/" = "search-forward"
"?" = "search-backward"
"*" = "find-word-forward"
"#" = "find-word-backward"
":" = "command-mode"
# files & panes (space is the leader)
"ctrl-s" = "save"
"space p" = "command-palette"
"space f" = "find-files"
"space s" = "grep-project"
"space b" = "switch-buffer"
"space w" = "save"
"space q" = "quit"
"space d" = "show-diagnostics"
"]d" = "diagnostic-next"
"[d" = "diagnostic-prev"
# vim's `K` keyword lookup, answered by the language server.
"K" = "hover"
"space a" = "code-action"
# vim's goto-definition; `space r` lists every reference in a grep-style popup.
"gd" = "goto-definition"
"space r" = "find-references"
# rename the symbol under the cursor everywhere, buffers and files alike.
"space m" = "rename-symbol"
"space e" = "spell-suggest"
# vim's spelling suggestion key.
"z=" = "spell-suggest"
"space x" = "clear-search-highlight"
"space F" = "format-buffer"
# layout
"space o" = "only-pane"
"space z" = "zoom-pane"
"space v" = "split-vertical"
"space h" = "split-horizontal"
"space n" = "split-auto"
"space c" = "close-pane"
"space =" = "equalize-panes"
# `ctrl-w` then a direction moves between panes, as in vim.
"ctrl-w h" = "focus-left"
"ctrl-w j" = "focus-down"
"ctrl-w k" = "focus-up"
"ctrl-w l" = "focus-right"
"space left" = "focus-left"
"space right" = "focus-right"
"space up" = "focus-up"
"space down" = "focus-down"
"space tab" = "focus-next"
"shift-tab" = "focus-prev"
"space H" = "move-left"
"space J" = "move-down"
"space K" = "move-up"
"space L" = "move-right"
"space ctrl-h" = "resize-left"
"space ctrl-j" = "resize-down"
"space ctrl-k" = "resize-up"
"space ctrl-l" = "resize-right"
"space plus" = "resize-right"
"space minus" = "resize-left"
"space g e" = "layout-equal"
"space g g" = "layout-golden"
# toggles
"space t n" = "toggle-line-numbers"
"space t c" = "toggle-cursorline"
"space t w" = "toggle-wrap"
"space t s" = "toggle-spell"
"space t f" = "toggle-auto-format"
"space t m" = "toggle-mouse"

[keymap.insert]
"esc" = "exit-insert"
"ctrl-[" = "exit-insert"
"enter" = "insert-newline"
"ctrl-j" = "insert-newline"
"tab" = "insert-tab"
"shift-tab" = "insert-backtab"
"backspace" = "insert-backspace"
"ctrl-h" = "insert-backspace"
"delete" = "insert-delete"
"ctrl-w" = "insert-delete-word"
"ctrl-u" = "insert-delete-line-start"
"ctrl-t" = "insert-indent-line"
"ctrl-o" = "normal-once"
"left" = "move-left"
"right" = "move-right"
"up" = "move-up"
"down" = "move-down"
"home" = "line-start"
"end" = "line-end"

[keymap.visual]
"v" = "visual"
"V" = "visual-line"
"ctrl-v" = "visual-block"
"o" = "swap-anchor"
"esc" = "normal"
"i" = "inside"
"a" = "around"

[keymap.operator]
# `i` / `a` introduce text objects here rather than insert mode.
"i" = "inside"
"a" = "around"
"t" = "till-char"
"T" = "till-char-back"
