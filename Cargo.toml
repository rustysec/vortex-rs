[package]
name = "vortex-rs"
description = "vortex — a modal, async, grammar-aware terminal code editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
name = "vortex"
path = "src/lib.rs"

[[bin]]
name = "vortex"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
ratatui = "0.30"
ropey = "1.6.1"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "process",
    "time",
    "io-util",
    "fs",
] }
ignore = "0.4"
similar = "3"
unicode-width = "0.2"
unicode-segmentation = "1"
dirs = "6"

# poll() on stdin, so the terminal colour query never blocks or eats keystrokes
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# --- grammar stack: pinned together, tree-sitter core + grammars must agree on ABI ---
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"

[dev-dependencies]
insta = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
